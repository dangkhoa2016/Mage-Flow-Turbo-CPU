name: Rebuild v1.0.0 Publication

on:
  push:
    branches:
      - release/v1.0.0-staging

permissions:
  contents: write
  actions: write

jobs:
  rebuild:
    if: contains(github.event.head_commit.message, '[execute-v1-rebuild]')
    runs-on: ubuntu-24.04
    env:
      REPO: dangkhoa2016/Mage-Flow-Turbo-Native-Inference
      STAGING_BRANCH: release/v1.0.0-staging
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v1.0.0-staging
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Snapshot current public state
        id: snapshot
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pre-rebuild-snapshot"
          SNAP="$RUNNER_TEMP/pre-rebuild-snapshot"

          git fetch origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/v1.0.0-staging:refs/remotes/origin/release/v1.0.0-staging' \
            '+refs/tags/*:refs/tags/*'

          OLD_MAIN="$(git rev-parse refs/remotes/origin/main)"
          STAGING_HEAD="$(git rev-parse HEAD)"
          printf '%s\n' "$OLD_MAIN" > "$SNAP/main-before.txt"
          printf '%s\n' "$STAGING_HEAD" > "$SNAP/staging-head.txt"
          git log refs/remotes/origin/main --reverse \
            --format='%H%x09%an%x09%ae%x09%cn%x09%ce%x09%aI%x09%cI%x09%T%x09%s' \
            > "$SNAP/main-history-before.tsv"
          git ls-remote origin > "$SNAP/ls-remote-before.txt"
          gh api "repos/$REPO/releases/tags/v1.0.0" > "$SNAP/release-v1.0.0.json" || true
          gh api "repos/$REPO/git/ref/tags/v1.0.0" > "$SNAP/tag-v1.0.0.json" || true

          git bundle create "$SNAP/repository-before.bundle" \
            refs/remotes/origin/main \
            refs/remotes/origin/release/v1.0.0-staging \
            $(git for-each-ref --format='%(refname)' refs/tags)
          git bundle verify "$SNAP/repository-before.bundle"

          echo "old_main=$OLD_MAIN" >> "$GITHUB_OUTPUT"
          echo "staging_head=$STAGING_HEAD" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: v1.0.0-pre-rebuild-snapshot
          path: ${{ runner.temp }}/pre-rebuild-snapshot
          if-no-files-found: error
          retention-days: 90

      - name: Build clean public candidate
        id: candidate
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/public-candidate"
          rm -rf "$WORK"
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$WORK"
          cd "$WORK"

          git remote set-url origin "https://github.com/$REPO.git"
          gh auth setup-git
          git fetch origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/v1.0.0-staging:refs/remotes/origin/release/v1.0.0-staging'

          OLD_MAIN="$(git rev-parse refs/remotes/origin/main)"
          STAGING_HEAD="$(git rev-parse refs/remotes/origin/release/v1.0.0-staging)"
          test "$OLD_MAIN" = "${{ steps.snapshot.outputs.old_main }}"

          git checkout -B clean-public "$OLD_MAIN"

          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter '
            export GIT_AUTHOR_NAME="Đăng Khoa"
            export GIT_AUTHOR_EMAIL="i.am@dangkhoa.dev"
            export GIT_COMMITTER_NAME="Đăng Khoa"
            export GIT_COMMITTER_EMAIL="i.am@dangkhoa.dev"
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          ' -- clean-public

          git diff --binary "$OLD_MAIN" "$STAGING_HEAD" -- . \
            ':(exclude).github/workflows/reconstruct-v1.0.0.yml' \
            > "$RUNNER_TEMP/staging-final.patch"
          test -s "$RUNNER_TEMP/staging-final.patch"
          git apply --index "$RUNNER_TEMP/staging-final.patch"

          RELEASE_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export GIT_AUTHOR_NAME='Đăng Khoa'
          export GIT_AUTHOR_EMAIL='i.am@dangkhoa.dev'
          export GIT_COMMITTER_NAME='Đăng Khoa'
          export GIT_COMMITTER_EMAIL='i.am@dangkhoa.dev'
          export GIT_AUTHOR_DATE="$RELEASE_DATE"
          export GIT_COMMITTER_DATE="$RELEASE_DATE"
          git commit -m 'chore(release): harden v1.0.0 publication integrity'

          FINAL_HEAD="$(git rev-parse HEAD)"
          FINAL_TREE="$(git rev-parse HEAD^{tree})"
          echo "final_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"
          echo "final_tree=$FINAL_TREE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$FINAL_HEAD" > "$RUNNER_TEMP/FINAL_HEAD.txt"
          git log --reverse \
            --format='%H%x09%an%x09%ae%x09%cn%x09%ce%x09%aI%x09%cI%x09%T%x09%s' \
            > "$RUNNER_TEMP/final-history.tsv"

      - name: Verify clean candidate before publication
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/public-candidate"
          python -m pip install -e .
          python -m pytest tests/ -q
          python -m compileall -q mageflow_native integrations scripts
          for f in $(find scripts -type f -name '*.sh'); do bash -n "$f"; done
          python -m json.tool notebooks/kaggle-production-demo.ipynb >/dev/null
          python scripts/publication/audit_public_surface.py --root .
          python scripts/publication/verify_history.py . --branch HEAD
          python scripts/publication/audit_release_contract.py
          if find . -type f \
              \( -name '*.gguf' -o -name '*.safetensors' -o -name '*.ckpt' -o -name '*.pt' -o -name '*.pth' -o -name '*.onnx' \) \
              -print -quit | grep -q .; then
            echo 'Model/runtime weight file is forbidden in the source repository.' >&2
            exit 1
          fi
          echo 'CANDIDATE_ALL_GATES=PASS'

      - name: Verify remote lease immediately before destructive publication
        run: |
          set -euo pipefail
          LIVE_MAIN="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$LIVE_MAIN" = "${{ steps.snapshot.outputs.old_main }}"
          echo 'REMOTE_LEASE_PRECHECK=PASS'

      - name: Replace unseen first-publication release and main
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/public-candidate"
          gh release delete v1.0.0 --repo "$REPO" --yes || true
          git push origin :refs/tags/v1.0.0 || true
          git push origin clean-public:main \
            --force-with-lease=refs/heads/main:${{ steps.snapshot.outputs.old_main }}

          LIVE_MAIN="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$LIVE_MAIN" = "${{ steps.candidate.outputs.final_head }}"
          test -z "$(git ls-remote --tags origin refs/tags/v1.0.0)"
          if gh release view v1.0.0 --repo "$REPO" >/dev/null 2>&1; then
            echo 'Old v1.0.0 release still exists' >&2
            exit 1
          fi
          echo 'PUBLIC_MAIN_REPLACEMENT=PASS'

      - name: Dispatch exact-head main validation workflows
        id: dispatch
        run: |
          set -euo pipefail
          DISPATCH_AFTER="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ci.yml --repo "$REPO" --ref main
          gh workflow run native-runtime.yml --repo "$REPO" --ref main
          sleep 8

          CI_RUN="$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event workflow_dispatch --limit 10 --json databaseId,headSha,createdAt --jq '[.[] | select(.headSha == "${{ steps.candidate.outputs.final_head }}")][0].databaseId')"
          NR_RUN="$(gh run list --repo "$REPO" --workflow native-runtime.yml --branch main --event workflow_dispatch --limit 10 --json databaseId,headSha,createdAt --jq '[.[] | select(.headSha == "${{ steps.candidate.outputs.final_head }}")][0].databaseId')"
          test -n "$CI_RUN" -a "$CI_RUN" != "null"
          test -n "$NR_RUN" -a "$NR_RUN" != "null"
          echo "ci_run=$CI_RUN" >> "$GITHUB_OUTPUT"
          echo "native_run=$NR_RUN" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-head main validation
        run: |
          set -euo pipefail
          gh run watch "${{ steps.dispatch.outputs.ci_run }}" --repo "$REPO" --exit-status
          gh run watch "${{ steps.dispatch.outputs.native_run }}" --repo "$REPO" --exit-status

          CI_HEAD="$(gh run view "${{ steps.dispatch.outputs.ci_run }}" --repo "$REPO" --json headSha --jq '.headSha')"
          NR_HEAD="$(gh run view "${{ steps.dispatch.outputs.native_run }}" --repo "$REPO" --json headSha --jq '.headSha')"
          test "$CI_HEAD" = "${{ steps.candidate.outputs.final_head }}"
          test "$NR_HEAD" = "${{ steps.candidate.outputs.final_head }}"
          echo 'FINAL_MAIN_CI=PASS'
          echo 'FINAL_MAIN_NATIVE_RUNTIME=PASS'

      - name: Write rebuild result
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/rebuild-result"
          cp "$RUNNER_TEMP/FINAL_HEAD.txt" "$RUNNER_TEMP/rebuild-result/" 2>/dev/null || true
          cp "$RUNNER_TEMP/final-history.tsv" "$RUNNER_TEMP/rebuild-result/" 2>/dev/null || true
          cat > "$RUNNER_TEMP/rebuild-result/result.txt" <<EOF
          old_main=${{ steps.snapshot.outputs.old_main }}
          staging_head=${{ steps.snapshot.outputs.staging_head }}
          final_head=${{ steps.candidate.outputs.final_head }}
          final_tree=${{ steps.candidate.outputs.final_tree }}
          ci_main_run=${{ steps.dispatch.outputs.ci_run }}
          native_runtime_main_run=${{ steps.dispatch.outputs.native_run }}
          EOF

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v1.0.0-rebuild-result
          path: ${{ runner.temp }}/rebuild-result
          if-no-files-found: warn
          retention-days: 90
